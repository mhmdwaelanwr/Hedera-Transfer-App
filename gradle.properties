# Project-wide Gradle settings.
# Force a project-local Gradle user home to avoid hard failures when the global
# ~/.gradle cache is corrupted (e.g. missing groovy-dsl/dependencies-accessors metadata.bin).
# Using a relative path keeps it portable across machines.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Dgradle.user.home=.gradle-user-home

# AndroidX settings
android.useAndroidX=true
android.nonTransitiveRClass=true

# Performance settings (Updated to non-deprecated options)
android.dependency.useConstraints=false
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false

# Enable modern behaviors
android.usesSdkInManifest.disallowed=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=true
android.enableAppCompileTimeRClass=true
android.builtInKotlin=true
android.defaults.buildfeatures.resvalues=false
